<!DOCTYPE html>

<html class="hub-inframe" lang="fr">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>WifiKey</title>

  <link rel="stylesheet" href="vendor/pc-command-kit/tokens/kit.css" />
  <link rel="stylesheet" href="vendor/pc-command-kit/components/embed.css" />
  <link rel="stylesheet" href="vendor/pc-command-kit/components/standalone.css" />
  <link rel="stylesheet" href="vendor/pc-command-kit/components/tool-chrome.css" />

  <link rel="stylesheet" href="fonts/fonts.css" />

<link rel="stylesheet" href="tokens.css" />

  <link rel="stylesheet" href="shell.css" />

  <link rel="stylesheet" href="styles.css" />

  <link rel="stylesheet" href="progress.css" />

  <script>
    (function () {
      try {
        if (/(?:^|[?&])embed=1(?:&|$)/.test(location.search || "")) {
          document.documentElement.classList.add("pcd-embed");
          document.addEventListener("DOMContentLoaded", function () {
            if (document.body) document.body.classList.add("pcd-embed");
          });
        }
      } catch (e) {}
    })();
  </script>
</head>

<body class="theme-pc-command">

  <div class="bg" aria-hidden="true"></div>

  <div class="shell">

    <aside class="sidebar">

      <div class="brand">

        <img class="brand-mark" src="app-icon.svg" width="40" height="40" alt="" />

        <div class="brand-text">

          <h1>WifiKey</h1>

          <p data-i18n="tagline">Profils Wi‑Fi · clé claire</p>

        </div>

      </div>

      <span class="badge">LOCAL</span>

      <div class="feature-desc" id="featureDesc">

        <strong data-i18n="featuresTitle">Fonctions</strong>

        <span data-i18n="features">Liste les profils WLAN et affiche la clé (key=clear, admin).</span>

      </div>

      <p class="privacy-note" id="privacyNote" data-privacy-fr="Mr-Aurevo-X ne collecte aucune donnée. Clés Wi‑Fi locales uniquement — ne les partagez pas." data-privacy-en="Mr-Aurevo-X does not collect your data. Local tool only.">Mr-Aurevo-X ne collecte aucune donnée. Clés Wi‑Fi locales uniquement — ne les partagez pas.</p>

      <p class="copyright" data-i18n="copyright">© 2026 Mr-Aurevo-X · local · CGU dans L'Atelier PC Command</p>

    </aside>

    <div class="main">

      <header class="page-header">

        <h2 data-i18n="title">Wi‑Fi</h2>

        <p id="meta">—</p>

      </header>



      <div class="toolbar">

        <button type="button" class="btn accent" id="btnRefresh" data-i18n="btnRefresh">Rafraîchir</button>

        <button type="button" class="btn" id="btnKey" data-i18n="btnKey">Afficher clé</button>



      </div>

      <div class="table-wrap" style="max-height:320px"><table><thead><tr>

        <th data-i18n="thName">Profil</th>

      </tr></thead><tbody id="tbody"></tbody></table></div>

      <div class="key-box" id="keyBox" data-i18n="keyPlaceholder">—</div>



            <div class="progress-row" id="progressRow" hidden>

        <span id="progressLabel" class="progress-label"></span>

        <div class="progress" id="progress"><i id="progressBar"></i></div>

      </div>

      <p class="status" id="status"></p>

    </div>

  </div>

  <script src="suite-boot.js"></script>

  <script src="suite-progress.js"></script>

  <script src="vendor/pc-command-kit/components/tool-chrome.js"></script>
    <script src="../hub-api-shim.js"></script>
  <script>HubApiShim.install('wifikey');</script>
<script src="app.js"></script>

</html>
